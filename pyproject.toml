[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "viper-lang"
version = "0.0.3a"
description = "Viper - a Python-Connected language"
authors = [{name = "G0Ju.VBS", email = "kaneivbs@gmail.com"}]
dependencies = ["lark>=1.1.0"]
scripts = {viper = "viper.cli:main"}
[project.license]
text = "wala license ginawa ko lang kasi gusto ko"
[project.optional-dependencies]
lsp = ["pygls>=2.1,<3"]
test = ["pytest>=8"]
[tool.setuptools]
packages = ["viper"]
[tool.pytest.ini_options]
testpaths = ["tests"]
